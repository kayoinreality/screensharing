appId: com.kayor.lanscreenshare
productName: LAN ScreenShare
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
compression: maximum
win:
  target:
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: LAN-ScreenShare-${version}.${ext}
portable:
  # Caminho de extracao fixo: sem isso o exe cai em %TEMP%\<uuid> diferente a cada
  # execucao e a regra de firewall (indexada por caminho) precisa ser recriada sempre.
  unpackDirName: lan-screenshare
  artifactName: LAN-ScreenShare-${version}.${ext}
