name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Validar tipos
        run: npm run typecheck

      - name: Build de produção
        run: npm run build

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar executável
        run: npm run dist

      - name: Criar release automática
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-v${{ github.run_number }}-${{ github.sha }}
          name: Release automática ${{ github.run_number }}
          generate_release_notes: true
          files: dist/LAN-ScreenShare-*.exe
