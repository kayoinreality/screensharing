name: Validar e publicar o app

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Validar
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Verificar build de produção
        run: npm run build

  release:
    name: Gerar executável e publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Baixar a versão marcada
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar executável portátil
        run: npm run dist

      - name: Criar release no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "A tag ${{ github.ref_name }} não corresponde à versão v$version do package.json."
          }
          $artifact = Get-ChildItem -Path dist -Filter '*.exe' | Select-Object -First 1
          if (-not $artifact) { throw 'O executável de distribuição não foi encontrado.' }
          gh release create "${{ github.ref_name }}" $artifact.FullName --title "LAN ScreenShare ${{ github.ref_name }}" --generate-notes
